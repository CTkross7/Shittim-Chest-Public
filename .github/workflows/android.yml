# [Unofficial] 싯딤의 상자 APK 빌드 — main 에 push 할 때마다 자동.
# 1) 에셋 장부 검사 (ASSETS.md 에 출처가 없는 파일이 있으면 실패)
# 2) 서명된 APK 빌드 → Releases 에 build-<번호> 로 업로드 → 앱이 자동으로 찾아서 업데이트한다.
name: Android APK

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Asset ledger check
        run: python3 tools/check_assets.py

  build:
    needs: assets
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Signing key (Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secrets 에 KEYSTORE_BASE64 · KEYSTORE_PASSWORD 가 없습니다 (docs/BUILD.md). 업데이트가 덮어써지려면 고정 서명 키가 필요합니다."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/release.jks

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle -p android --no-daemon assembleRelease

      - name: Release notes (최근 커밋)
        run: |
          {
            echo "[Unofficial] 싯딤의 상자 — 자동 빌드 #${BUILD_NUMBER} · ${GITHUB_SHA::7}"
            echo
            echo "비공식 팬메이드 앱입니다. NEXON Games / NEXON Korea 와 관련이 없습니다. 개발: CTkross"
            echo
            git log -10 --pretty='- %s' "${{ github.event.before }}..${GITHUB_SHA}" 2>/dev/null || git log -5 --pretty='- %s'
          } > notes.txt
          cat notes.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: v0.1.${{ github.run_number }} (Unofficial)
          body_path: notes.txt
          files: android/app/build/outputs/apk/release/*.apk
          make_latest: true
